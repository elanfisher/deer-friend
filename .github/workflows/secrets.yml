# Two independent secret scanners over the ENTIRE git history (not just the latest push).
# They run straight from their official container images, pinned by digest, rather than via the
# wrapper actions — those compare against the previous commit, which breaks on a branch's first push.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 1" # weekly: new detection rules get applied to old commits too

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # whole history
          persist-credentials: false

      - name: Scan every commit
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --verbose --exit-code 1 .
          # image: ghcr.io/gitleaks/gitleaks:v8.30.1

  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan every commit (verified and unverified findings)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/repo" \
            ghcr.io/trufflesecurity/trufflehog@sha256:1cec88f18ca39e26e04e61fe9d886c9c4e5f2fc0ba4f2ed185cac0722bd8a076 \
            git file:///repo --results=verified,unknown --fail --no-update
          # image: ghcr.io/trufflesecurity/trufflehog:3.97.5
