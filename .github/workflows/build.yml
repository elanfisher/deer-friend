# Makes sure the Mac app still compiles and packages on every change.
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and package DeerFriend.app
        run: ./build_app.sh

      - name: Check the bundle
        run: |
          test -x DeerFriend.app/Contents/MacOS/DeerFriend
          test -f DeerFriend.app/Contents/Resources/web/index.html
          plutil -lint DeerFriend.app/Contents/Info.plist
          codesign --verify --verbose DeerFriend.app
