# Publishing a download: push a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`).
# Builds the app on GitHub's machines, virus-scans it, attaches a SHA-256 checksum and a signed
# build-provenance attestation (proof it was built from this repo at this commit), then publishes
# a GitHub Release. The stable download link for a website is:
#   https://github.com/elanfisher/deer-friend/releases/latest/download/DeerFriend-mac.zip
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build the Mac app
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write     # to sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and zip
        run: |
          ./build_app.sh
          ditto -c -k --keepParent DeerFriend.app DeerFriend-mac.zip
          shasum -a 256 DeerFriend-mac.zip | tee DeerFriend-mac.zip.sha256

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: DeerFriend-mac.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: DeerFriend-mac.zip*
          retention-days: 7

  malware-scan:
    name: ClamAV scan of the download
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: dist

      - name: Scan
        run: |
          docker run --rm --entrypoint sh -v "$PWD/dist:/scan:ro" \
            clamav/clamav@sha256:0e31ce089574268aefa0b543767d66b70240ab51ed49eec53e07f18d5629d817 \
            -c 'freshclam --stdout || echo "freshclam failed; using bundled definitions"
                clamscan --recursive --infected --scan-archive=yes --alert-broken=yes /scan'
          # image: clamav/clamav:stable

  publish:
    name: Publish the release
    needs: malware-scan # nothing is published unless the scan is clean
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'EOF'
          **Install (Mac, macOS 13+):** download `DeerFriend-mac.zip`, unzip, and drag
          **DeerFriend.app** into Applications. The first time, right-click it and choose **Open**
          (it isn't notarized by Apple yet, so macOS asks once).

          **Verify the download** (optional):
          `shasum -a 256 DeerFriend-mac.zip` should match `DeerFriend-mac.zip.sha256`, and
          `gh attestation verify DeerFriend-mac.zip --repo elanfisher/deer-friend` proves it was
          built by this repository's Release workflow. The build was virus-scanned with ClamAV.
          EOF
          gh release create "$TAG" dist/DeerFriend-mac.zip dist/DeerFriend-mac.zip.sha256 \
            --repo "$REPO" --title "Deer Friend $TAG" --notes-file notes.md
