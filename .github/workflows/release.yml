# Publishing the downloads: push a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`).
# Builds the Mac disk image, the Windows installer and the Chrome extension on GitHub's machines,
# virus-scans everything, attaches SHA-256 checksums and signed build-provenance attestations,
# then publishes a GitHub Release. Stable links for a website:
#   https://github.com/elanfisher/deer-friend/releases/latest/download/DeerFriend-mac.dmg
#   https://github.com/elanfisher/deer-friend/releases/latest/download/DeerFriendSetup.exe
#   https://github.com/elanfisher/deer-friend/releases/latest/download/deer-friend-extension.zip
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  mac:
    name: Mac disk image
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # to sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the disk image
        run: ./scripts/make_dmg.sh

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/DeerFriend-mac.dmg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac
          path: dist/DeerFriend-mac.dmg*
          retention-days: 7

  windows:
    name: Windows installer
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the app
        working-directory: windows
        run: |
          dotnet publish DeerFriend.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false -o publish

      - name: Build the installer
        working-directory: windows
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - name: Checksum
        run: |
          (Get-FileHash dist/DeerFriendSetup.exe -Algorithm SHA256).Hash.ToLower() + "  DeerFriendSetup.exe" `
            | Out-File -Encoding ascii dist/DeerFriendSetup.exe.sha256
          Get-Content dist/DeerFriendSetup.exe.sha256

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/DeerFriendSetup.exe

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: dist/DeerFriendSetup.exe*
          retention-days: 7

  extension:
    name: Chrome extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package
        run: |
          ./scripts/build_extension.sh
          sha256sum dist/deer-friend-extension.zip | tee dist/deer-friend-extension.zip.sha256

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/deer-friend-extension.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension
          path: dist/deer-friend-extension.zip*
          retention-days: 7

  malware-scan:
    name: ClamAV scan of every download
    needs: [mac, windows, extension]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Scan
        run: |
          ls -la dist
          docker run --rm --entrypoint sh -v "$PWD/dist:/scan:ro" \
            clamav/clamav@sha256:0e31ce089574268aefa0b543767d66b70240ab51ed49eec53e07f18d5629d817 \
            -c 'freshclam --stdout || echo "freshclam failed; using bundled definitions"
                clamscan --recursive --infected --scan-archive=yes --alert-broken=yes /scan'
          # image: clamav/clamav:stable

  publish:
    name: Publish the release
    needs: malware-scan # nothing is published unless the scan is clean
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'EOF'
          A little pixel-art fawn who lives on your desktop — or in your browser.

          **New to this?** The [download page](https://elanfisher.github.io/deer-friend/) picks the
          right file for your computer and walks you through it. Step-by-step instructions for every
          platform are in [INSTALL.md](https://github.com/elanfisher/deer-friend/blob/main/INSTALL.md).

          ### Mac (macOS 13+)
          Download **DeerFriend-mac.dmg**, open it and drag **DeerFriend.app** into Applications.
          It isn't notarized by Apple yet, so the first launch is blocked once: open
          **System Settings → Privacy & Security**, scroll down and click **Open Anyway**
          (macOS 14 and earlier: right-click the app → **Open**). She lives in the menu bar.

          ### Windows 10/11
          Download **DeerFriendSetup.exe** and run it. Windows SmartScreen will warn about an
          unknown publisher the first time: click **More info → Run anyway**. She lives in the
          notification area. Needs the free Microsoft Edge WebView2 runtime, which is already on
          Windows 11 and most Windows 10 machines.

          ### Chrome / Edge extension
          Download **deer-friend-extension.zip**, unzip it, then go to `chrome://extensions`,
          turn on **Developer mode** and choose **Load unpacked** → the unzipped folder.

          ### Verifying the downloads
          Each file has a `.sha256` checksum, was virus-scanned with ClamAV, and carries a signed
          build-provenance attestation:
          `gh attestation verify <file> --repo elanfisher/deer-friend`
          EOF
          gh release create "$TAG" dist/* --repo "$REPO" --title "Deer Friend $TAG" --notes-file notes.md
