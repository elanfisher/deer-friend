# Extra static analysis alongside CodeQL: Semgrep for code patterns, zizmor for the security of
# these GitHub Actions workflows themselves.
name: Static analysis

on:
  push: # every branch, so findings show up before a pull request is opened
  pull_request:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            semgrep/semgrep@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198 \
            semgrep scan --metrics=off --json --output semgrep.json \
              --config p/default --config p/javascript --config p/secrets --config p/github-actions
          # image: semgrep/semgrep:1.177.0

      - name: Report findings
        run: |
          # One annotation per finding (visible on the run page), and fail if there are any.
          python3 - <<'PY'
          import json, sys
          results = json.load(open("semgrep.json"))["results"]
          for r in results:
              msg = r["extra"]["message"].replace("\n", " ")[:400]
              print(f"::error file={r['path']},line={r['start']['line']},title={r['check_id']}::{msg}")
          print(f"{len(results)} finding(s)")
          sys.exit(1 if results else 0)
          PY

  zizmor:
    name: zizmor (workflow security)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            ghcr.io/zizmorcore/zizmor@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101 \
            --offline .github/workflows
          # image: ghcr.io/zizmorcore/zizmor:1.30.1
