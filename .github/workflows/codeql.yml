# Static security analysis for the Swift app, the web page's JavaScript, and these workflows.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1" # weekly, so new CodeQL rules get applied to unchanged code too

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript # includes the inline <script> in web/index.html
            os: ubuntu-latest
            build-mode: none
          - language: actions
            os: ubuntu-latest
            build-mode: none
          - language: swift
            os: macos-15
            build-mode: manual
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Build (Swift)
        if: matrix.build-mode == 'manual'
        run: swift build -c release

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
